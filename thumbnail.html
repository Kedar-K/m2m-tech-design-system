<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0;width:1280px;height:854px;overflow:hidden}
  .wrap{display:flex;width:1280px;height:854px}
  .main{flex:1;background:var(--brand-yellow);display:flex;align-items:center;justify-content:center}
  .word{font-family:var(--font-display);font-weight:700;color:var(--brand-ink);letter-spacing:-0.03em;text-align:center;line-height:0.92}
  .word b{display:block;font-size:150px}
  .word small{display:block;font-family:var(--font-mono);font-weight:500;font-size:40px;letter-spacing:0.2em;margin-top:22px;color:var(--brand-ink);opacity:0.72}
  .strip{width:300px;display:flex;flex-direction:column}
  .strip i{flex:1}
</style></head>
<body><div class="wrap">
  <div class="main"><div class="word"><b>M2M</b><b>TECH</b><small>CODE AI</small></div></div>
  <div class="strip">
    <i style="background:var(--status-online)"></i>
    <i style="background:var(--status-fault)"></i>
    <i style="background:var(--status-info)"></i>
    <i style="background:var(--brand-ink)"></i>
  </div>
</div></body></html>
