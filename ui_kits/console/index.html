<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>M2M Tech — Ops Console</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"><\/script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"><\/script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"><\/script>
<script src="../../_ds_bundle.js"><\/script>
<style>html,body{margin:0;height:100%}</style>
</head><body class="m2m-dark">
<div id="root"></div>
<script src="../_shared/Icons.jsx" type="text/babel"><\/script>
<script src="Shell.jsx" type="text/babel"><\/script>
<script src="Views.jsx" type="text/babel"><\/script>
<script type="text/babel">
const { Dialog, Button, Select, Checkbox } = window.M2MTechDesignSystem_02d78c;
function App() {
  const [view, setView] = React.useState("Overview");
  const [deploy, setDeploy] = React.useState(false);
  const body = view === "Overview" ? <window.Overview /> : view === "Alerts" ? <window.Alerts /> : <window.Placeholder name={view} />;
  return (
    <div style={{ display: "flex", height: "100vh", background: "var(--neutral-900)" }}>
      <window.Sidebar active={view} onNav={setView} />
      <div style={{ flex: 1, display: "flex", flexDirection: "column", minWidth: 0 }}>
        <window.Topbar title={view} onDeploy={() => setDeploy(true)} />
        <div style={{ flex: 1, overflow: "auto" }}>{body}</div>
      </div>
      <Dialog open={deploy} title="Deploy ruleset" onClose={() => setDeploy(false)}
        footer={<><Button variant="outline" onClick={() => setDeploy(false)}>Cancel</Button><Button onClick={() => setDeploy(false)} leadingIcon={<window.M2MIcon name="zap" size={15} />}>Push to 42 nodes</Button></>}>
        <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
          <Select label="Ruleset version" options={["MEA v2.4 (latest)", "MEA v2.3", "MEA v2.2"]} />
          <Select label="Target site" options={["Plant 04 — all lines", "Plant 04 — Line B", "All sites"]} />
          <Checkbox label="Validate against digital twin before rollout" defaultChecked />
          <Checkbox label="Write to evidence fabric" defaultChecked />
        </div>
      </Dialog>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
<\/script>
</body></html>
